services:
  - type: web
    name: k8-canvas-intelligence-preview
    runtime: python
    plan: free
    rootDir: services/intelligence
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn k8_canvas.main:app --app-dir src --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
